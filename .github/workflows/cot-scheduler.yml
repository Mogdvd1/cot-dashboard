jobs:
  run-cot-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          node-version: 22   # explicitly set to Node.js 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          node-version: 22   # explicitly set to Node.js 22

      - name: Run script
        run: python main.py
